[package]
name = "robot-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
comms = { path = "../comms" }
cpal = "0.18.1"
earshot = "1.2.1"
libcamera = "0.7.0"
thiserror = "2.0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["full"] }
xgo = "0.1"
